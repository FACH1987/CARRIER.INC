<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Soporte · Carrier.INC</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="support.js" defer></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/carrier-180.png">
</head>
<body>
  <main class="admin-layout">
    <a href="market.html">Volver a Carrier.INC</a>
    <h1>Soporte</h1>
    <p id="support-status" role="status" aria-live="polite">Consultando soporte…</p>
    <section id="support-content" aria-label="Conversaciones de soporte"></section>
    <form id="support-form" class="post-form" hidden>
      <label class="form-field"><span>Mensaje</span><textarea name="body" rows="4" minlength="2" maxlength="800" required></textarea></label>
      <button class="button button-dark" type="submit">Enviar mensaje</button>
    </form>
  </main>
</body>
</html>
